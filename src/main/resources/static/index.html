<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Event Registration</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f3f8;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            height: 32px;
            box-sizing: border-box;
            margin-top: 3px;
            border: 1px solid #aaa;
            padding: 5px;
        }

        button {
            width: 100%;
            height: 35px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: green;
            font-weight: bold;
        }

        #result p {
            margin: 3px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Event Registration</h1>

    <form id="registrationForm">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" required>

        <label>Event:</label>
        <select id="event" required>
            <option value="">-- Select Event --</option>
            <option value="Seminar">Seminar</option>
            <option value="Workshop">Workshop</option>
            <option value="Hackathon">Hackathon</option>
            <option value="Conference">Conference</option>
        </select>

        <label>Date of registration:</label>
        <input type="date" id="date" required>

        <button type="submit">Register</button>

    </form>

    <div id="result">

        <p>Registration Successful!</p>

        <p>Name: <span id="resultName"></span></p>

        <p>Email: <span id="resultEmail"></span></p>

        <p>Phone: <span id="resultPhone"></span></p>

        <p>Event: <span id="resultEvent"></span></p>

        <p>Date: <span id="resultDate"></span></p>

    </div>

</div>


<script>

document.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const registration = {

        name: document.getElementById("name").value,

        email: document.getElementById("email").value,

        phone: document.getElementById("phone").value,

        event: document.getElementById("event").value,

        date: document.getElementById("date").value
    };


    fetch("/api/registrations", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(registration)

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("result").style.display = "block";

        document.getElementById("resultName").textContent =
            data.name;

        document.getElementById("resultEmail").textContent =
            data.email;

        document.getElementById("resultPhone").textContent =
            data.phone;

        document.getElementById("resultEvent").textContent =
            data.event;

        document.getElementById("resultDate").textContent =
            data.date;
    })

    .catch(error => {

        alert("Registration failed!");

        console.error(error);

    });

});

</script>

</body>
</html>
